name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      # Guardia anti-leak multi-tenant: ogni query su tabelle con tenant_id
      # deve filtrare per tenant (eccezioni annotate `// cross-tenant:`).
      # Usa la cache scripts/tenant-tables.json committata, niente DB.
      - name: Tenant scoping
        run: npm run check:tenant-scope
